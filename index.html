<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2a2a2d">
  <title>現金出納帳</title>
  <!-- どちらの画面か（?view=calendar なら予定カレンダー）を、描く前に決める -->
  <script src="view.js"></script>
  <!-- フォント（Google Fonts。無料）：日本語は Zen Maru Gothic、数字・欧文は Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Quicksand:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <!-- 背景と金の二重枠（画面に固定。押せない飾り） -->
  <div class="bg" aria-hidden="true"></div>
  <div class="mv breathe" aria-hidden="true"></div>
  <div class="frame-line outer" aria-hidden="true"></div>
  <div class="glowframe" aria-hidden="true"><div></div></div>
  <div class="frame-line inner" aria-hidden="true"></div>

  <main class="app">
    <header class="head">
      <div class="titles">
        <div class="title-fr">Livre de caisse</div>
        <div class="title-jp">現金出納帳</div>
      </div>
      <button type="button" class="pill" id="historyBtn" hidden>履歴</button>
    </header>

    <div class="divider" aria-hidden="true">
      <div class="rule left"></div>
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 0 L9 5 L14 7 L9 9 L7 14 L5 9 L0 7 L5 5 Z" fill="#c9a961"/></svg>
      <div class="rule right"></div>
    </div>

    <!-- 女の子（ループ動画。止まるときは静止画）とセリフ -->
    <section class="stage">
      <div class="photo">
        <div class="photo-in">
          <video id="video" src="diary_loop.mp4" autoplay muted loop playsinline preload="auto" poster="card_top.jpg" aria-hidden="true"></video>
          <img id="still" src="card_top.jpg" alt="" hidden>
        </div>
      </div>
      <p class="line" id="bubble" role="status" aria-live="polite">…</p>
    </section>

    <!-- 入力の画面 -->
    <section class="pane input" id="input" hidden>
      <div class="items" id="items" role="radiogroup" aria-label="何に使ったか"></div>
      <input class="name" id="name" type="text" maxlength="50" autocomplete="off" hidden>
      <div class="amount-row">
        <div class="cat-label" id="catLabel">項目を選んでください</div>
        <div class="amount" id="amount">¥ 0</div>
      </div>
      <div class="keys" id="keys">
        <button type="button" class="k key" data-key="1">1</button><button type="button" class="k key" data-key="2">2</button><button type="button" class="k key" data-key="3">3</button>
        <button type="button" class="k key" data-key="4">4</button><button type="button" class="k key" data-key="5">5</button><button type="button" class="k key" data-key="6">6</button>
        <button type="button" class="k key" data-key="7">7</button><button type="button" class="k key" data-key="8">8</button><button type="button" class="k key" data-key="9">9</button>
        <button type="button" class="k key" data-key="00">00</button><button type="button" class="k key" data-key="0">0</button>
        <button type="button" class="k key" data-key="back" aria-label="1文字消す">←</button>
      </div>
      <button type="button" class="k submit" id="record" aria-disabled="true">項目を選んでください</button>
    </section>

    <!-- 記録したあとの画面 -->
    <section class="pane done" id="done" hidden>
      <div class="receipt">
        <div class="receipt-fr">Enregistré</div>
        <div class="receipt-item" id="doneItem"></div>
        <div class="receipt-amount" id="doneAmount"></div>
        <div class="receipt-rule"></div>
        <div class="receipt-total" id="doneTotal"></div>
        <div class="receipt-budget" id="doneBudget"></div>
      </div>
      <button type="button" class="k gold shine again" id="again">続けて記録する</button>
      <button type="button" class="ghost undo" id="undo">今の記録を取り消す</button>
      <button type="button" class="link" id="close">LINEに戻る</button>
    </section>

    <!-- 履歴（今月の自分の記録） -->
    <section class="pane history" id="history" hidden>
      <div class="history-head">
        <div class="history-title">今月の記録</div>
        <div class="history-month" id="historyMonth"></div>
      </div>
      <div class="history-list" id="historyList"></div>
      <div class="confirm" id="confirm" hidden>
        <div class="confirm-text" id="confirmText"></div>
        <div class="confirm-buttons">
          <button type="button" class="ghost" id="confirmNo">やめる</button>
          <button type="button" class="gold" id="confirmYes">取り消す</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== 予定カレンダー（?view=calendar のときだけ calendar.js が出す） ===== -->
  <div class="cal-sky" aria-hidden="true" hidden></div>
  <div class="cal-aurora" aria-hidden="true" hidden><div class="au au1"></div><div class="au au2"></div><div class="au au3"></div></div>
  <div class="cal-fade" aria-hidden="true" hidden></div>

  <main class="cal" id="cal" hidden>
    <header class="head">
      <div class="titles">
        <div class="title-fr">Agenda</div>
        <div class="title-jp">予定帳</div>
      </div>
      <button type="button" class="pill k" id="calAdd" hidden>＋ 予定を書く</button>
    </header>

    <!-- 女の子（動画。止まるときは静止画。ファイル名は calendar.js の CAL_MEDIA）とセリフ -->
    <section class="cal-stage">
      <div class="photo">
        <div class="photo-in cal-photo">
          <video id="calVideo" muted loop playsinline preload="auto" aria-hidden="true"></video>
          <img id="calStill" alt="" hidden>
        </div>
      </div>
      <p class="cal-line" id="calBubble" role="status" aria-live="polite">…</p>
    </section>

    <!-- カレンダーと一覧 -->
    <section class="cal-pane" id="calMain" hidden>
      <div class="cal-tabs" id="calTabs" role="tablist">
        <button type="button" class="cal-tab k" role="tab" data-tab="cal">カレンダー</button>
        <button type="button" class="cal-tab k" role="tab" data-tab="tomorrow">明日</button>
        <button type="button" class="cal-tab k" role="tab" data-tab="week">1週間</button>
        <button type="button" class="cal-tab k" role="tab" data-tab="month">1か月</button>
        <button type="button" class="cal-tab k" role="tab" data-tab="later">その先</button>
      </div>

      <div class="cal-month" id="calMonth">
        <div class="cal-nav">
          <button type="button" class="cal-arrow k" id="calPrev" aria-label="前の月">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <div class="cal-title">
            <div class="cal-title-num" id="calMonthNum"></div>
            <div class="cal-title-name" id="calMonthName"></div>
          </div>
          <button type="button" class="cal-arrow k" id="calNext" aria-label="次の月">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="cal-dow" aria-hidden="true">
          <div class="sun">SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div class="sat">SAT</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <span><i class="who-wife"></i>奥様</span><span><i class="who-husband"></i>旦那様</span><span><i class="who-family"></i>家族</span>
        </div>
      </div>

      <div class="cal-list">
        <div class="cal-list-head">
          <div class="cal-list-title" id="calListTitle"></div>
          <div class="cal-list-sub" id="calListSub"></div>
        </div>
        <div id="calItems"></div>
      </div>

      <div class="confirm" id="calConfirm" hidden>
        <div class="confirm-text" id="calConfirmText"></div>
        <div class="confirm-buttons">
          <button type="button" class="ghost" id="calConfirmNo">やめる</button>
          <button type="button" class="gold" id="calConfirmYes">消す</button>
        </div>
      </div>
    </section>

    <!-- 予定を書く -->
    <section class="cal-pane cal-form" id="calForm" hidden>
      <div class="cal-row-head cal-date-row">
        <div class="cal-label">日付</div>
        <div class="cal-form-date" id="calFormDate"></div>
      </div>
      <div class="cal-field">
        <label class="cal-label" for="calTitle">予定の名前</label>
        <input class="cal-input" id="calTitle" type="text" maxlength="50" autocomplete="off">
      </div>
      <div class="cal-field">
        <div class="cal-row-head">
          <div class="cal-label">時間</div>
          <div class="cal-time-text" id="calTimeText"></div>
        </div>
        <div class="cal-hours" id="calHours"></div>
        <div class="cal-mins" id="calMins"></div>
        <button type="button" class="cal-allday k" id="calAllDay">時間なし（終日）</button>
      </div>
      <div class="cal-field">
        <div class="cal-label">だれの予定</div>
        <div class="cal-whos" id="calWhos"></div>
      </div>
      <div class="cal-spacer"></div>
      <button type="button" class="cal-save k" id="calSave" aria-disabled="true">書き留める</button>
      <button type="button" class="link" id="calBack">カレンダーに戻る</button>
    </section>
  </main>

  <!-- LIFF SDK（LINE 公式。最新の 2.x） -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- LIFF ID と記録の送り先（GAS の Webアプリの URL）。config.example.js をまねて作る -->
  <script src="config.js"></script>
  <script src="keypad.js"></script>
  <script src="app.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
